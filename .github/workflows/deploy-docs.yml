name: Deploy Docs

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # Non-strict: two pre-existing content links/anchors already fail
      # --strict (unrelated to CI/CD config) and shouldn't block deploys.
      - run: mkdocs build

      - run: mkdocs gh-deploy --force --clean
